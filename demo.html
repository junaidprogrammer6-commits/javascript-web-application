<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaskFlow — JavaScript Web Application</title>
<style>
:root{--bg:#0b0e13;--bg2:#131822;--card:#171d28;--line:#262f3d;--tx:#eef2f7;--mut:#8b96a5;--ac:#5eead4;--ac2:#818cf8;--err:#f87171;--warn:#fbbf24;--on:#0b0e13;
box-sizing:border-box}
:root[data-theme="light"]{--bg:#f5f7fa;--bg2:#eef1f6;--card:#fff;--line:#dbe1ea;--tx:#151b26;--mut:#5b6675;--ac:#0d9488;--ac2:#4f46e5;--err:#dc2626;--warn:#b45309;--on:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,-apple-system,'Segoe UI',sans-serif;transition:background .25s,color .25s}
.w{max-width:760px;margin:0 auto;padding:30px 20px 60px}
header{border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--bg2),var(--bg))}
header .w{display:flex;justify-content:space-between;align-items:center;padding:18px 20px}
.brand{display:flex;align-items:center;gap:9px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ac);box-shadow:0 0 10px var(--ac)}
h1{font-size:1.2rem;margin:0}
.theme-btn{background:none;border:1px solid var(--line);color:var(--tx);width:34px;height:34px;border-radius:9px;cursor:pointer}
.theme-btn:hover{border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:20px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{text-align:center}
.stat b{display:block;font-size:1.4rem;color:var(--ac)}
.stat span{color:var(--mut);font-size:.76rem}
.progress{height:8px;background:var(--bg2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac2),var(--ac));transition:width .4s}
form{display:grid;gap:10px}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
input,select{font:inherit;color:var(--tx);background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;width:100%}
input:focus,select:focus{outline:none;border-color:var(--ac)}
.btn{background:var(--ac);color:var(--on);border:none;border-radius:9px;padding:11px 20px;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{opacity:.9}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.toolbar input{flex:2;min-width:160px}
.toolbar select{flex:1;min-width:110px}
.task{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--bg2)}
.task.done .title{text-decoration:line-through;color:var(--mut)}
.task .chk{width:18px;height:18px;accent-color:var(--ac);flex-shrink:0}
.task .body{flex:1;min-width:0}
.title{font-weight:600;font-size:.95rem}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.badge{font-size:.72rem;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.badge.cat{color:var(--ac2)}
.pri-Low{color:var(--mut)}
.pri-Medium{color:var(--warn);border-color:var(--warn)}
.pri-High{color:var(--err);border-color:var(--err)}
.due{font-size:.72rem;color:var(--mut)}
.due.overdue{color:var(--err);font-weight:600}
.del{background:none;border:none;color:var(--mut);font-size:1.3rem;cursor:pointer;line-height:1;padding:4px 8px}
.del:hover{color:var(--err)}
.empty{color:var(--mut);text-align:center;padding:20px 0}
footer{text-align:center;color:var(--mut);font-size:.82rem;padding:20px 0}
@media(max-width:560px){.row{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr);gap:16px}}
</style>
</head>
<body>
<header><div class="w">
<div class="brand"><span class="dot"></span><h1>TaskFlow</h1></div>
<button class="theme-btn" id="themeBtn" aria-label="Toggle light or dark mode">◐</button>
</div></header>

<div class="w">
<div class="card">
<div class="stats">
  <div class="stat"><b id="statTotal">0</b><span>Total</span></div>
  <div class="stat"><b id="statPending">0</b><span>Pending</span></div>
  <div class="stat"><b id="statDone">0</b><span>Done</span></div>
  <div class="stat"><b id="statOverdue">0</b><span>Overdue</span></div>
</div>
<div class="progress"><i id="progressBar"></i></div>
</div>

<div class="card">
<form id="taskForm">
  <input name="title" placeholder="What needs to be done?" required maxlength="120">
  <div class="row">
    <input name="category" placeholder="Category (optional)" maxlength="40">
    <select name="priority" id="priority">
      <option>Low</option><option selected>Medium</option><option>High</option>
    </select>
    <input name="dueDate" type="date">
  </div>
  <button class="btn" type="submit">Add Task</button>
</form>
</div>

<div class="toolbar">
  <input type="text" id="search" placeholder="Search tasks...">
  <select id="statusFilter">
    <option value="all">All status</option>
    <option value="pending">Pending</option>
    <option value="done">Done</option>
  </select>
  <select id="priorityFilter">
    <option value="all">All priority</option>
    <option>Low</option><option>Medium</option><option>High</option>
  </select>
</div>

<div id="taskList"></div>

<footer>Data is saved in this browser only (localStorage) — no server needed.</footer>
</div>

<script>
"use strict";
// script.ts — compiled with: tsc script.ts --target es2019 --lib es2019,dom
const STORAGE_KEY = "jwa_tasks_v1";
let tasks = [];
let filter = { search: "", status: "all", priority: "all" };
function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}
function load() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
    }
    catch {
        return [];
    }
}
function save() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }
    catch {
        /* storage unavailable, ignore */
    }
}
function addTask(title, category, priority, dueDate) {
    tasks.unshift({ id: uid(), title, category, priority, dueDate, done: false, createdAt: Date.now() });
    save();
    render();
}
function toggleTask(id) {
    const t = tasks.find((x) => x.id === id);
    if (t)
        t.done = !t.done;
    save();
    render();
}
function deleteTask(id) {
    tasks = tasks.filter((x) => x.id !== id);
    save();
    render();
}
function isOverdue(t) {
    if (!t.dueDate || t.done)
        return false;
    return new Date(t.dueDate) < new Date(new Date().toDateString());
}
function applyFilter(list) {
    return list.filter((t) => {
        if (filter.status === "pending" && t.done)
            return false;
        if (filter.status === "done" && !t.done)
            return false;
        if (filter.priority !== "all" && t.priority !== filter.priority)
            return false;
        if (filter.search && !t.title.toLowerCase().includes(filter.search.toLowerCase()))
            return false;
        return true;
    });
}
function escapeHtml(s) {
    return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
function renderStats() {
    const total = tasks.length;
    const done = tasks.filter((t) => t.done).length;
    const pending = total - done;
    const overdue = tasks.filter(isOverdue).length;
    const set = (id, v) => (document.getElementById(id).textContent = String(v));
    set("statTotal", total);
    set("statDone", done);
    set("statPending", pending);
    set("statOverdue", overdue);
    const bar = document.getElementById("progressBar");
    bar.style.width = (total ? (done / total) * 100 : 0) + "%";
}
function renderList() {
    const list = document.getElementById("taskList");
    const visible = applyFilter(tasks);
    if (visible.length === 0) {
        list.innerHTML = '<p class="empty">No tasks match this view.</p>';
        return;
    }
    list.innerHTML = visible
        .map((t) => {
        const due = t.dueDate ? `<span class="due ${isOverdue(t) ? "overdue" : ""}">${escapeHtml(t.dueDate)}</span>` : "";
        return `
      <div class="task ${t.done ? "done" : ""}" data-id="${t.id}">
        <input type="checkbox" class="chk" ${t.done ? "checked" : ""} aria-label="Mark complete">
        <div class="body">
          <div class="title">${escapeHtml(t.title)}</div>
          <div class="meta">
            <span class="badge cat">${escapeHtml(t.category || "General")}</span>
            <span class="badge pri pri-${t.priority}">${t.priority}</span>
            ${due}
          </div>
        </div>
        <button class="del" aria-label="Delete task">&times;</button>
      </div>`;
    })
        .join("");
    list.querySelectorAll(".chk").forEach((el) => el.addEventListener("change", (e) => {
        const id = e.target.closest(".task").dataset.id;
        toggleTask(id);
    }));
    list.querySelectorAll(".del").forEach((el) => el.addEventListener("click", (e) => {
        const id = e.target.closest(".task").dataset.id;
        deleteTask(id);
    }));
}
function render() {
    renderStats();
    renderList();
}
function initForm() {
    const form = document.getElementById("taskForm");
    form.addEventListener("submit", (e) => {
        e.preventDefault();
        const data = Object.fromEntries(new FormData(form));
        const title = data.title.trim();
        if (!title)
            return;
        addTask(title, data.category.trim(), data.priority, data.dueDate);
        form.reset();
        document.getElementById("priority").value = "Medium";
    });
}
function initFilters() {
    const searchEl = document.getElementById("search");
    const statusEl = document.getElementById("statusFilter");
    const priorityEl = document.getElementById("priorityFilter");
    searchEl.addEventListener("input", () => {
        filter.search = searchEl.value;
        renderList();
    });
    statusEl.addEventListener("change", () => {
        filter.status = statusEl.value;
        renderList();
    });
    priorityEl.addEventListener("change", () => {
        filter.priority = priorityEl.value;
        renderList();
    });
}
function initTheme() {
    const root = document.documentElement;
    try {
        const saved = localStorage.getItem("jwa_theme");
        if (saved)
            root.dataset.theme = saved;
    }
    catch {
        /* ignore */
    }
    document.getElementById("themeBtn").addEventListener("click", () => {
        const isLight = root.dataset.theme === "light";
        root.dataset.theme = isLight ? "dark" : "light";
        try {
            localStorage.setItem("jwa_theme", root.dataset.theme);
        }
        catch {
            /* ignore */
        }
    });
}
function seedIfEmpty() {
    if (tasks.length > 0)
        return;
    tasks = [
        { id: uid(), title: "Set up project structure", category: "Setup", priority: "Medium", dueDate: "", done: true, createdAt: Date.now() },
        { id: uid(), title: "Design the task card layout", category: "Design", priority: "Low", dueDate: "", done: true, createdAt: Date.now() },
        { id: uid(), title: "Add search and filters", category: "Feature", priority: "High", dueDate: "", done: false, createdAt: Date.now() },
        { id: uid(), title: "Write the README", category: "Docs", priority: "Low", dueDate: "", done: false, createdAt: Date.now() },
    ];
    save();
}
document.addEventListener("DOMContentLoaded", () => {
    tasks = load();
    seedIfEmpty();
    initTheme();
    initForm();
    initFilters();
    render();
});
</script>
</body>
</html>
